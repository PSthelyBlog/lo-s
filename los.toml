# Which provider fills which role. Any provider can fill any role.

[roles]
dispatch = "local"          # reads plain-language lines; runs on every one, so keep it local
decode = "local"            # turns each instruction of a program into a micro-op
author = "claude"           # writes a new command when you type: teach NUMBER

[providers.local]
kind = "openai"             # any server with the OpenAI chat API; start this one with scripts/serve.sh
url = "http://127.0.0.1:8080/v1"
model = "gemma-4-26B-A4B-it-qat-q4_0.gguf"
# Sent with every request. llama-server reuses work from earlier requests unless told not to, and
# an answer then depends on what was asked before it. With the cache off an answer takes about
# 1.3 seconds longer and depends only on the request. Remove this line for another kind of server.
extra = { cache_prompt = false }

[providers.claude]
kind = "claude-cli"         # your own `claude` program and login
model = "claude-opus-5-5"
effort = "high"
